[package]
name = "diver-mcp-server"
version = "0.1.0"
edition = "2024"
description = "Diver's MCP server as a Rust rmcp sidecar: the seven-tool workspace surface (read_file, list_files, search_text, get_diagnostics, write_file, edit_file, run_command) behind the fail-closed policy gate ported from lua/ai/mcp/server/policy.lua. Modern protocol era only (2026-07-28)."
license = "Apache-2.0"

[dependencies]
# MCP standardization program (D-113): framing moves to the official
# Rust MCP SDK, modern era only (2026-07-28). The version pin is the
# fleet pin — one rmcp version across every estate server; bumps are
# single fleet events.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
