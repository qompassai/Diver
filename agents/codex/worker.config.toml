# ~/.codex/worker.config.toml — Pax-dispatched worker profile (primo)
#
# Layered on top of config.toml when invoked with `codex exec -p worker`.
# This profile exists for one purpose: non-interactive worker runs that Pax
# (the orchestrator) dispatches, each inside an isolated git worktree.
#
# Why a profile instead of base-config values: Matt's interactive TUI use
# keeps the safer on-request approvals; only headless worker runs — which
# physically cannot answer a prompt — get the non-interactive policy.
# CLI `-c` flags still override everything here per-invocation.
#
# Supervisor contract (the important part): the worker's final message is a
# *claim*, not a result. Nothing the worker writes advances any real state
# until Pax independently verifies it — build, tests, and Pax's own diff
# review. The sandbox bounds what the worker *can* do; the gates bound what
# its output *means*.

# No TTY exists to answer approval prompts in `codex exec`, so prompting
# policies would either hang or fail the run. "never" disables prompts;
# the sandbox below remains the bounding mechanism. Residual risk, stated
# plainly: commands run without asking, so the prompt must bound the task
# (explicit worktree, explicit files, explicit done-criteria) — the
# worktree isolation is the real containment, not this flag.
approval_policy = "never"

# The worker must write code to do its job. workspace-write confines those
# writes to the working root Pax assigns with `-C` (or `--worktree`).
# `danger-full-access` is never used for dispatched runs.
sandbox_mode = "workspace-write"
