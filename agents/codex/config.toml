# ~/.codex/config.toml — Matt's interactive defaults (primo, Arch)
#
# This file is layer 4 of 6 in Codex's config precedence (highest wins):
#   1. CLI flags (`-c key=value`)
#   2. `--profile <name>` (layers ~/.codex/<name>.config.toml)
#   3. Project `.codex/config.toml` (trusted projects only)
#   4. THIS FILE (~/.codex/config.toml)
#   5. /etc/codex/config.toml
#   6. Built-in defaults
#
# Pax-dispatched worker runs add layer 2 via `codex exec -p worker`
# (see worker.config.toml and README.md). Interactive TUI use is unaffected.

# When Codex must stop and ask before acting.
#   "untrusted"  — cannot run commands or write files without approval.
#   "on-request" — reads and runs safe commands freely; asks before writes.
#   "never"      — full autonomy within the sandbox (no prompts at all).
# Interactive default: on-request. The worker profile overrides to "never"
# because a non-interactive run has no TTY to answer a prompt.
approval_policy = "on-request"

# What the sandbox lets model-spawned commands touch.
#   "read-only"          — may read, may not write.
#   "workspace-write"    — may write inside the working root.
#   "danger-full-access" — no sandboxing. Never use for dispatched runs.
sandbox_mode = "workspace-write"

# No `model =` line: unset means "use the account default". Pin a model
# explicitly (here or per-run with `-m`) only with an exact, verified
# model string — never a guessed one.

[projects."/home/phaedrus/.GH/diver"]
# Trust level lets this project's own .codex/config.toml layer in (level 3).
# Untrusted projects skip project-level config entirely.
trust_level = "trusted"

[projects."/home/phaedrus/.config"]
trust_level = "trusted"

[projects."/home/phaedrus/workspace/repos/phlow"]
trust_level = "trusted"

[tui]
screen_reader_detection_done = true

model = "gpt-6-astra"
model_reasoning_effort = "high"
